<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员面板</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; color: #333; min-height: 100vh; }
    .container { max-width: 800px; margin: 0 auto; padding: 20px; }
    h1 { text-align: center; color: #1a1a2e; margin-bottom: 24px; font-size: 28px; font-weight: 600; }
    .card { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .card-title { font-size: 16px; font-weight: 600; color: #1a1a2e; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; gap: 8px; }
    .card-title .icon { font-size: 20px; }
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .info-item { padding: 12px 16px; background: #f8f9fa; border-radius: 8px; }
    .info-item .label { font-size: 12px; color: #999; margin-bottom: 4px; }
    .info-item .value { font-size: 14px; font-weight: 500; color: #333; word-break: break-all; }
    .info-item.full { grid-column: 1 / -1; }
    .btn-row { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
    .btn { padding: 10px 24px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-primary { background: #4361ee; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #3a56d4; }
    .btn-warning { background: #fa8c16; color: #fff; }
    .btn-warning:hover:not(:disabled) { background: #d46b08; }
    .btn-danger { background: #ff4d4f; color: #fff; }
    .btn-danger:hover:not(:disabled) { background: #d9363e; }
    .btn-success { background: #52c41a; color: #fff; }
    .btn-success:hover:not(:disabled) { background: #3f9914; }
    .btn-secondary { background: #f0f0f0; color: #333; }
    .btn-secondary:hover:not(:disabled) { background: #e0e0e0; }
    .log-box { background: #1a1a2e; color: #a9b7c6; border-radius: 8px; padding: 16px; font-family: 'Consolas', 'Monaco', monospace; font-size: 13px; line-height: 1.6; max-height: 300px; overflow-y: auto; margin-top: 12px; white-space: pre-wrap; word-break: break-all; }
    .log-box .log-success { color: #52c41a; }
    .log-box .log-error { color: #ff4d4f; }
    .log-box .log-info { color: #4361ee; }
    .log-box .log-time { color: #666; margin-right: 8px; }
    .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .status-badge.clean { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; }
    .status-badge.dirty { background: #fff2e8; color: #fa8c16; border: 1px solid #ffd591; }
    .status-badge .dot { width: 6px; height: 6px; border-radius: 50%; }
    .status-badge.clean .dot { background: #52c41a; }
    .status-badge.dirty .dot { background: #fa8c16; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; color: #4361ee; text-decoration: none; font-size: 14px; margin-bottom: 16px; }
    .back-link:hover { text-decoration: underline; }
    .confirm-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.45); z-index: 1000; align-items: center; justify-content: center; }
    .confirm-overlay.show { display: flex; }
    .confirm-box { background: #fff; border-radius: 16px; padding: 24px; max-width: 400px; width: 90%; box-shadow: 0 8px 40px rgba(0,0,0,0.15); }
    .confirm-box h3 { font-size: 16px; margin-bottom: 12px; color: #1a1a2e; }
    .confirm-box p { font-size: 14px; color: #666; margin-bottom: 20px; line-height: 1.6; }
    .confirm-box .btn-row { justify-content: flex-end; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #e0e0e0; border-top-color: #4361ee; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <a class="back-link" href="/">← 返回主页</a>
    <h1>管理员面板</h1>

    <div class="card">
      <div class="card-title"><span class="icon">📋</span> 系统信息</div>
      <div class="info-grid" id="infoGrid">
        <div class="info-item">
          <div class="label">当前分支</div>
          <div class="value" id="branch">加载中...</div>
        </div>
        <div class="info-item">
          <div class="label">工作区状态</div>
          <div class="value" id="status">加载中...</div>
        </div>
        <div class="info-item full">
          <div class="label">最新提交</div>
          <div class="value" id="lastCommit">加载中...</div>
        </div>
        <div class="info-item">
          <div class="label">更新时间</div>
          <div class="value" id="lastUpdate">加载中...</div>
        </div>
        <div class="info-item">
          <div class="label">运行时长</div>
          <div class="value" id="uptime">加载中...</div>
        </div>
        <div class="info-item">
          <div class="label">进程 PID</div>
          <div class="value" id="pid">-</div>
        </div>
        <div class="info-item">
          <div class="label">Node 版本</div>
          <div class="value" id="nodeVersion">-</div>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="refreshInfo()">刷新信息</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><span class="icon">🚀</span> 更新操作</div>
      <p style="font-size:13px;color:#888;margin-bottom:16px;">点击「一键更新」将自动执行 git pull 拉取最新代码，然后重启服务完成热更新。</p>
      <div class="btn-row">
        <button class="btn btn-success" id="updateBtn" onclick="doUpdate()">一键更新 (Git Pull + 重启)</button>
        <button class="btn btn-primary" id="pullBtn" onclick="doPull()">仅 Git Pull</button>
        <button class="btn btn-warning" id="restartBtn" onclick="confirmRestart()">仅重启服务</button>
      </div>
      <div class="log-box" id="logBox" style="display:none;"></div>
    </div>
  </div>

  <!-- 确认弹窗 -->
  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
      <h3 id="confirmTitle">确认操作</h3>
      <p id="confirmMsg">确定要执行此操作吗？</p>
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="closeConfirm()">取消</button>
        <button class="btn btn-danger" id="confirmOk">确定</button>
      </div>
    </div>
  </div>

  <script>
    /* ========== 日志 ========== */
    function addLog(text, type = '') {
      const box = document.getElementById('logBox');
      box.style.display = 'block';
      const time = new Date().toLocaleTimeString('zh-CN');
      const line = document.createElement('div');
      line.className = type ? `log-${type}` : '';
      line.innerHTML = `<span class="log-time">[${time}]</span>${escHtml(text)}`;
      box.appendChild(line);
      box.scrollTop = box.scrollHeight;
    }

    function clearLog() {
      const box = document.getElementById('logBox');
      box.innerHTML = '';
      box.style.display = 'none';
    }

    function escHtml(s) { return String(s || '').replace(/&/g, '&').replace(/</g, '<').replace(/>/g, '>').replace(/"/g, '"'); }

    /* ========== 系统信息 ========== */
    async function refreshInfo() {
      try {
        const res = await fetch('/api/admin/info');
        const json = await res.json();
        if (!json.success) {
          addLog('获取系统信息失败: ' + json.message, 'error');
          return;
        }
        const d = json.data;
        document.getElementById('branch').textContent = d.branch || '-';
        document.getElementById('lastCommit').textContent = d.lastCommit || '-';
        document.getElementById('lastUpdate').textContent = d.lastUpdateTime || '-';
        document.getElementById('pid').textContent = d.pid || '-';
        document.getElementById('nodeVersion').textContent = d.nodeVersion || '-';

        // 运行时长
        const uptime = d.uptime || 0;
        const h = Math.floor(uptime / 3600);
        const m = Math.floor((uptime % 3600) / 60);
        const s = Math.floor(uptime % 60);
        document.getElementById('uptime').textContent = h > 0 ? `${h}时${m}分${s}秒` : m > 0 ? `${m}分${s}秒` : `${s}秒`;

        // 工作区状态
        const statusEl = document.getElementById('status');
        if (d.status === 'clean') {
          statusEl.innerHTML = '<span class="status-badge clean"><span class="dot"></span>干净</span>';
        } else {
          statusEl.innerHTML = `<span class="status-badge dirty"><span class="dot"></span>有变更</span>`;
        }
      } catch (err) {
        addLog('获取系统信息失败: ' + err.message, 'error');
      }
    }

    /* ========== Git Pull ========== */
    async function doPull() {
      const btn = document.getElementById('pullBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>拉取中...';
      addLog('开始执行 git pull...', 'info');

      try {
        const res = await fetch('/api/admin/pull', { method: 'POST' });
        const json = await res.json();
        if (json.success) {
          addLog('Git pull 成功', 'success');
          if (json.data && json.data.output) {
            addLog(json.data.output, 'success');
          }
        } else {
          addLog('Git pull 失败: ' + json.message, 'error');
        }
      } catch (err) {
        addLog('请求失败: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '仅 Git Pull';
        refreshInfo();
      }
    }

    /* ========== 重启服务 ========== */
    function confirmRestart() {
      showConfirm('确认重启', '重启服务将导致短暂不可用，确定要继续吗？', async () => {
        closeConfirm();
        const btn = document.getElementById('restartBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>重启中...';
        addLog('正在重启服务...', 'info');

        try {
          await fetch('/api/admin/restart', { method: 'POST' });
          addLog('重启指令已发送，服务即将重启...', 'success');
          addLog('等待服务重新上线...', 'info');
          await waitForServer();
          addLog('服务已重新上线！', 'success');
        } catch (err) {
          addLog('请求失败: ' + err.message, 'error');
        } finally {
          btn.disabled = false;
          btn.textContent = '仅重启服务';
          refreshInfo();
        }
      });
    }

    /* ========== 一键更新 ========== */
    function doUpdate() {
      showConfirm('一键更新', '将执行 git pull 拉取最新代码并重启服务，确定要继续吗？', async () => {
        closeConfirm();
        const btn = document.getElementById('updateBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>更新中...';
        clearLog();
        addLog('开始一键更新...', 'info');

        try {
          const res = await fetch('/api/admin/update', { method: 'POST' });
          const json = await res.json();
          if (json.success) {
            addLog('Git pull 成功', 'success');
            if (json.data && json.data.output) {
              addLog(json.data.output, 'success');
            }
            addLog('服务即将重启...', 'info');
            addLog('等待服务重新上线...', 'info');
            await waitForServer();
            addLog('服务已重新上线，更新完成！', 'success');
          } else {
            addLog('更新失败: ' + json.message, 'error');
          }
        } catch (err) {
          addLog('请求失败: ' + err.message, 'error');
        } finally {
          btn.disabled = false;
          btn.textContent = '一键更新 (Git Pull + 重启)';
          refreshInfo();
        }
      });
    }

    /* ========== 等待服务上线 ========== */
    async function waitForServer(maxRetries = 30, interval = 2000) {
      for (let i = 0; i < maxRetries; i++) {
        await new Promise(r => setTimeout(r, interval));
        try {
          const res = await fetch('/api/admin/info', { signal: AbortSignal.timeout(3000) });
          if (res.ok) return;
        } catch {}
      }
      throw new Error('服务重启超时');
    }

    /* ========== 确认弹窗 ========== */
    function showConfirm(title, msg, onOk) {
      document.getElementById('confirmTitle').textContent = title;
      document.getElementById('confirmMsg').textContent = msg;
      document.getElementById('confirmOverlay').classList.add('show');
      document.getElementById('confirmOk').onclick = onOk;
    }

    function closeConfirm() {
      document.getElementById('confirmOverlay').classList.remove('show');
    }

    /* ========== 初始化 ========== */
    refreshInfo();
  </script>
</body>
</html>
